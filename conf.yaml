            WHERE rowid = NEW.rowid;
        END;
  dpt_trg_ins: >
    CREATE TRIGGER IF NOT EXISTS dpt_after_insert
      AFTER INSERT ON dpt
      BEGIN
          UPDATE dpt
          SET
              created_at = COALESCE(NEW.created_at, datetime('now')),
              updated_at = COALESCE(NEW.updated_at, datetime('now'))
          WHERE rowid = NEW.rowid;
      END;
  dpt_trg_upd: >
    CREATE TRIGGER IF NOT EXISTS dpt_after_update
        AFTER UPDATE ON dpt
        BEGIN
