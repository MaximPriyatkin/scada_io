sel:
  sys: |
    SELECT * FROM sys;
  alarm: |
    SELECT a.sg, a.id_limit, a.type, t.name as type_name,
           a.val, a.txt, a.dead_h, a.dead_l, a.priority, a.disable
      FROM alarm a
      JOIN ref_limit_type t ON a.type = t.id
      WHERE a.disable IS NULL OR a.disable = 0
      ORDER BY a.sg, a.id_limit;
  iec_addr_map: |
    SELECT id, ca, ioa FROM iec_addr;
upd:
  sys: 
    sql: |
      INSERT INTO sys(id, name, dsc, disable)
      VALUES (:id, 
              :name, 
              :dsc, 
              :disable)
      ON CONFLICT (id) DO UPDATE SET
        name = excluded.name,
        dsc = excluded.dsc,
        disable = excluded.disable;
    required: [id, name]
    fname: sys  
  dpt: 
    sql: |
      INSERT INTO dpt (id, sys, name, dsc, disable)
      VALUES (:id,
              (SELECT id FROM sys WHERE name = :sys),
              :name,
              :dsc, 
              :disable)
      ON CONFLICT (id) DO UPDATE SET
        sys = excluded.sys,
        name = excluded.name,
        dsc = excluded.dsc,
        disable = excluded.disable;
    required: [id, sys, name]
    dpt: dpt
  dpe: 
    sql: |
      INSERT INTO dpe (id, dpt, name, dsc, grp, disable)
      VALUES (:id,
              (SELECT dpt.id FROM dpt
               JOIN sys ON dpt.sys = sys.id
               WHERE sys.name = :sys AND dpt.name = :dpt),
              :name,
              :dsc, 
              :grp, 
              :disable)
      ON CONFLICT (id) DO UPDATE SET
        dpt = excluded.dpt,
        name = excluded.name,
        dsc = excluded.dsc,
        grp = excluded.grp,
        disable = excluded.disable;
    required: [sys, dpt, id, name]
    fname: dpe
  grp:
    sql: |
      INSERT INTO grp (id, type, name, dsc, unit, fmt, parent)
      VALUES (:id,
              :type,
              :name,
              :dsc,
              :unit,
              :fmt,
              :parent
              )
      ON CONFLICT (id) DO UPDATE SET
        type = excluded.type,
        name = excluded.name,
        dsc = excluded.dsc,
        unit = excluded.unit,
        fmt = excluded.fmt,
        parent = excluded.parent;
  dp:
    sql: |
      INSERT INTO dp (id, dpt, name, dsc, disable)
      VALUES (:id,
              (SELECT dpt.id FROM dpt
              JOIN sys ON dpt.sys = sys.id
              WHERE sys.name = :sys AND dpt.name = :dpt),
              :name,
              :dsc,
              :disable
              )
      ON CONFLICT (id) DO UPDATE SET
        dpt = excluded.dpt,
        name = excluded.name,
        dsc = excluded.dsc,
        disable = excluded.disable;
  sg:
    sql: |
      INSERT INTO sg (id, name, dsc, disable)
      VALUES (:id, 
              :name,
              :dsc,
              :disable
              )
      ON CONFLICT (id) DO UPDATE SET
        name = excluded.name,
        dsc = excluded.dsc,
        disable = excluded.disable;
    fname: sg    
  iec_addr:
    sql: |
      INSERT INTO iec_addr (id, asdu, ca, ioa, cot, th, conv)
      VALUES (:id, 
              :iec_asdu,
              :iec_ca,
              :iec_ioa,
              :iec_cot,
              :threshold,
              :conv
              )
      ON CONFLICT (id) DO UPDATE SET
        asdu = excluded.asdu,
        ca = excluded.ca,
        ioa = excluded.ioa,
        cot = excluded.cot,
        th = excluded.th,
        conv = excluded.conv;
    fname: sg
exp:
  sys:
    fname: 'ref/out/sys.csv'
    cols: [id, name, dsc, disable]
    sql: >
      SELECT id, name, dsc, disable FROM sys;
  dpt:
    fname: 'ref/out/dpt.csv'
    cols: [id, sys, dpt, dsc, disable]
    sql: >
      SELECT dpt.id, sys.name, dpt.name, dpt.dsc, dpt.disable FROM dpt
      JOIN sys ON dpt.sys = sys.id;
  dpe:
    fname: 'ref/out/dpe.csv'
    cols: [id, sys, dpt, name, dsc, grp, disable]
    sql: >
      SELECT dpe.id, sys.name, dpt.name, dpe.name, dpe.dsc,
             dpe.grp, dpe.disable FROM dpe
      JOIN dpt ON dpe.dpt = dpt.id
      JOIN sys ON dpt.sys = sys.id;
  dp:
    fname: 'ref/out/dp.csv'
    cols: [id, sys, dpt, name, dsc, disable]
    sql: >
      SELECT dp.id, sys.name, dpt.name, dp.name, dp.dsc, dp.disable FROM dp
      JOIN dpt ON dp.dpt = dpt.id
      JOIN sys ON dpt.sys = sys.id;
  grp:
    fname: 'ref/out/grp.csv'
    cols: [id, parent, name, dsc, unit, fmt, type]
    sql: >
      SELECT c.id, p.name, c.name, c.dsc,
        c.unit, c.fmt, c.type
        FROM grp c
        LEFT JOIN grp p ON p.id = c.parent;
  alarm:
    fname: 'ref/out/alarm.csv'
    cols: [sg, id_limit, type, val, txt, dead_h, dead_l, priority, disable]
    sql: >
      SELECT a.sg, a.id_limit, t.name, a.val, a.txt,
             a.dead_h, a.dead_l, a.priority, a.disable
        FROM alarm a
        JOIN alarm_lim_type t ON a.type = t.id
        ORDER BY a.sg, a.id_limit;
