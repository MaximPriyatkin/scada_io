db: cis.db
create:
  order:
    sys: 1
    sg: 1
    dpt: 1
    grp: 1
    dpe: 1
    dp: 1
    sg_rel: 1
    alarm_lim_type: 1
    alarm: 1
    iec_addr: 1
    vl_cur: 0
    vl: 0
    sys_trg_ins: 1
    sys_trg_upd: 1
    sg_trg_ins: 1
    sg_trg_upd: 1
    dpt_trg_ins: 1
    dpt_trg_upd: 1
    grp_trg_ins: 1
    grp_trg_upd: 1
    dpe_trg_ins: 1
    dpe_trg_upd: 1
    dp_trg_ins: 1
    dp_trg_upd: 1
    sg_rel_trg_ins: 1
    sg_rel_trg_upd: 1
    iec_addr_trg_ins: 1
    iec_addr_trg_upd: 1
    alarm_trg_ins: 1
    alarm_trg_upd: 1

  sys: >
    CREATE TABLE IF NOT EXISTS sys (
      id INTEGER PRIMARY KEY,
      name TEXT UNIQUE NOT NULL,
      dsc TEXT,
      disable INTEGER DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME
    );
  sg: >
    CREATE TABLE IF NOT EXISTS sg (
      id INTEGER PRIMARY KEY,
      name TEXT UNIQUE NOT NULL,
      dsc TEXT,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME
    );
  dpt: >
    CREATE TABLE IF NOT EXISTS dpt (
      id INTEGER PRIMARY KEY,
      name TEXT NOT NULL,
      dsc TEXT,
      sys INTEGER NOT NULL,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME,
      UNIQUE (name, sys),
      FOREIGN KEY (sys) REFERENCES sys(id) ON DELETE CASCADE
    );
  grp: >
    CREATE TABLE IF NOT EXISTS grp (
      id INTEGER PRIMARY KEY,
      name TEXT UNIQUE NOT NULL,
      dsc TEXT,
      unit INTEGER,
      fmt TEXT,
      type INTEGER,
      parent INTEGER,
      created_at DATETIME,
      updated_at DATETIME,
      FOREIGN KEY (parent) REFERENCES grp(id)
    );
  dpe: >
    CREATE TABLE IF NOT EXISTS dpe (
      id INTEGER PRIMARY KEY,
      name TEXT NOT NULL,
      dsc TEXT,
      dpt INTEGER NOT NULL,
      grp INTEGER,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME,
      UNIQUE (dpt, name),
      FOREIGN KEY (dpt) REFERENCES dpt(id) ON DELETE CASCADE,
      FOREIGN KEY (grp) REFERENCES grp(id) ON UPDATE CASCADE
    );
  dp: >
    CREATE TABLE IF NOT EXISTS dp (
      id INTEGER PRIMARY KEY,
      name TEXT UNIQUE NOT NULL,
      dsc TEXT,
      topic INTEGER,
      dpt INTEGER NOT NULL,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME,
      FOREIGN KEY (dpt) REFERENCES dpt(id) ON DELETE CASCADE
    );
  sg_rel: >
    CREATE TABLE IF NOT EXISTS sg_rel (
      id INTEGER PRIMARY KEY,
      sg INTEGER NOT NULL,
      dp INTEGER NOT NULL,
      dpe INTEGER NOT NULL,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME,
      UNIQUE(dp, dpe),
      FOREIGN KEY (sg) REFERENCES sg(id) ON DELETE CASCADE,
      FOREIGN KEY (dp) REFERENCES dp(id) ON DELETE CASCADE,
      FOREIGN KEY (dpe) REFERENCES dpe(id) ON DELETE CASCADE
    );
  alarm_lim_type: >
    CREATE TABLE IF NOT EXISTS alarm_lim_type (
      id INTEGER PRIMARY KEY,
      name TEXT UNIQUE NOT NULL,
      dsc TEXT
    );
  alarm: >
    CREATE TABLE IF NOT EXISTS alarm (
      sg INTEGER NOT NULL,
      id_limit INTEGER NOT NULL,
      type INTEGER NOT NULL,
      val REAL,
      txt TEXT,
      dead_h REAL,
      dead_l REAL,
      priority INTEGER,
      disable INTEGER  DEFAULT 0,
      created_at DATETIME,
      updated_at DATETIME,
      PRIMARY KEY (sg, id_limit),
      FOREIGN KEY (sg) REFERENCES sg(id) ON DELETE CASCADE,
      FOREIGN KEY (type) REFERENCES alarm_lim_type(id)
    );
  iec_addr: >
    CREATE TABLE IF NOT EXISTS iec_addr (
      id INTEGER PRIMARY KEY,
      asdu INTEGER,
      ca INTEGER,
      ioa INTEGER,
      cot INTEGER,
      th REAL,
      conv TEXT,
      created_at DATETIME,
      updated_at DATETIME,
      FOREIGN KEY (id) REFERENCES sg(id) ON DELETE CASCADE
    );
  vl_cur: >
    CREATE TABLE IF NOT EXISTS vl_cur (
      sg INTEGER PRIMARY KEY,
      vl REAL NOT NULL,
      ts DOUBLE NOT NULL,
      q INTEGER NOT NULL,
      FOREIGN KEY (sg) REFERENCES sg(id) ON DELETE CASCADE
    );
  vl: >
    CREATE TABLE IF NOT EXISTS vl (
      sg INTEGER NOT NULL,
      vl REAL NOT NULL,
      ts DOUBLE NOT NULL,
      q INTEGER NOT NULL,
      PRIMARY KEY (sg, ts),
      FOREIGN KEY (sg) REFERENCES sg(id) ON DELETE CASCADE
    );
  sys_trg_ins: >
    CREATE TRIGGER IF NOT EXISTS sys_after_insert
      AFTER INSERT ON sys
      BEGIN
          UPDATE sys
          SET
              created_at = COALESCE(NEW.created_at, datetime('now')),
              updated_at = COALESCE(NEW.updated_at, datetime('now'))
          WHERE rowid = NEW.rowid;
      END;
  sys_trg_upd: >
    CREATE TRIGGER IF NOT EXISTS sys_after_update
        AFTER UPDATE ON sys
        BEGIN
            UPDATE sys
            SET updated_at = datetime('now')
            WHERE rowid = NEW.rowid;
        END;
  sg_trg_ins: >
    CREATE TRIGGER IF NOT EXISTS sg_after_insert
      AFTER INSERT ON sg
      BEGIN
          UPDATE sg
          SET
              created_at = COALESCE(NEW.created_at, datetime('now')),
              updated_at = COALESCE(NEW.updated_at, datetime('now'))
          WHERE rowid = NEW.rowid;
      END;
  sg_trg_upd: >
    CREATE TRIGGER IF NOT EXISTS sg_after_update
        AFTER UPDATE ON sg
        BEGIN
            UPDATE sg
